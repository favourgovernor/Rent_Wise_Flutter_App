name: rentwise_app
description: A property management system for landlords

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Design ────────────────────────────
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.7
  fl_chart: ^1.2.0
  shimmer: ^3.0.0

  # ── State Management ───────────────────────
  provider: ^6.1.0

  # ── Storage ────────────────────────────────
  shared_preferences: ^2.3.2       # onboarding flag + preferences
  flutter_secure_storage: ^9.2.2   # auth tokens

  # ── Local Database (offline-first) ─────────
  drift: ^2.18.0                   # SQLite ORM
  drift_flutter: ^0.2.0            # Flutter integration
  sqlite3_flutter_libs: ^0.5.0     # SQLite binaries
  path_provider: ^2.1.0            # app documents directory
  path: ^1.9.0                     # file path utilities

  # ── Networking ─────────────────────────────
  http: ^1.2.0                     # Upstash Redis REST calls
  dio: ^5.3.3                      # general HTTP client

  # ── Supabase ───────────────────────────────
  supabase_flutter: ^2.5.0

  # ── Authentication ─────────────────────────
  google_sign_in: ^6.2.0

  # ── Connectivity & Offline Sync ────────────
  connectivity_plus: ^6.0.3        # online/offline detection

  # ── Utilities ──────────────────────────────
  uuid: ^4.4.0                     # generates real UUIDs for Supabase
  intl: ^0.20.2
  image_picker: ^1.0.4
  pinput: ^6.0.2                   # OTP input boxes
  url_launcher: ^6.3.0

  # ── Navigation ─────────────────────────────
  go_router: ^17.2.0

  # ── Forms & Validation ─────────────────────
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Drift code generation ──────────────────
  drift_dev: ^2.18.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/